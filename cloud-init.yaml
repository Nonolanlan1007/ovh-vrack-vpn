#cloud-config
packages:
  - wireguard
  - iptables
write_files:
  - content: |
      [Interface]
      Address = 172.16.0.1/24
      ListenPort = ${wg_port}
      PrivateKey = ${server_private_key}
      PostUp   = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -s 172.16.0.0/24 -d ${allowed_ips} -j MASQUERADE
      PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -s 172.16.0.0/24 -d ${allowed_ips} -j MASQUERADE
      
      [Peer]
      PublicKey = ${client_public_key}
      PresharedKey = ${preshared_key}
      AllowedIPs = 172.16.0.2/32
      PersistentKeepalive = 20
    path: /etc/wireguard/wg0.conf
    permissions: '0600'
  - content: |
      net.ipv4.ip_forward=1
    path: /etc/sysctl.d/99-wg.conf
    permissions: '0600'
runcmd:
 - systemctl enable --now wg-quick@wg0
 - sysctl --system